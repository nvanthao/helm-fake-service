apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fake-service.fullname" . }}
  labels:
    {{- include "fake-service.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>fake-service</title></head>
    <body>
      <h1>fake-service</h1>
      <p>Deployed by Helm chart <strong>{{ .Chart.Name }}</strong> version <strong>{{ .Chart.Version }}</strong>.</p>
      <p>Release: <strong>{{ .Release.Name }}</strong> &mdash; Namespace: <strong>{{ .Release.Namespace }}</strong></p>
    </body>
    </html>
